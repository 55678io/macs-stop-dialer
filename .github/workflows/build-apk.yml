name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MACS-STOP-Dialer.apk

      - name: Upload APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MACS-STOP-Dialer-APK
          path: MACS-STOP-Dialer.apk

      - name: Publish release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MACS STOP Dialer 2.${{ github.run_number }}
          files: MACS-STOP-Dialer.apk
          make_latest: true
